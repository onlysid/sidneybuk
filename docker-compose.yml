# sidneyb.uk: the site and its database.
#
#   cp .env.example .env     then fill in the three secrets (or run ./setup.sh, which does it for you)
#   docker compose up -d --build
#
# The site listens on PORT (3000 unless changed); put the reverse proxy (Caddy, Traefik, nginx) in
# front of it for HTTPS. Two volumes hold everything worth keeping: the database, and uploaded files.
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside Docker the database is reached by its service name, whatever .env says for local use.
      DATABASE_URL: postgres://${POSTGRES_USER:-sidneyb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sidneyb}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sidneyb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sidneyb}
    # Reachable from this machine only, so `npm run dev` on the host can use it. Nothing outside can.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sidneyb} -d ${POSTGRES_DB:-sidneyb}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  uploads:
