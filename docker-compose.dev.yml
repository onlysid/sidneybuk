# For working on the site: ./setup.sh dev
#
# Used on top of docker-compose.yml. It adds one service, "dev", which runs the site with live reload from
# this folder: save a file here and the page updates within a second, keeping its state (Fast Refresh).
# Nothing here is used on the server.
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx next dev -H 0.0.0.0 -p 3000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sidneyb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sidneyb}
      UPLOAD_DIR: /app/data/uploads
      NEXT_TELEMETRY_DISABLED: "1"
      # A folder shared from macOS or Windows does not always tell the container when a file changes, so
      # changes are looked for on a timer instead; 300 ms is quick enough to feel instant.
      WATCHPACK_POLLING: "300"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      # The packages and the build cache are the container's own (they are built for Linux, not for this machine).
      - dev_modules:/app/node_modules
      - dev_next:/app/.next

volumes:
  dev_modules:
  dev_next:
